<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
        <meta name="description" content="BlueMap static backup">
        <meta name="version" content="5.16">
        <link rel="icon" href="./assets/favicon-DEN7TZ5X.png">
        <link rel="manifest" href="./assets/manifest-vz4Wm4Dd.webmanifest">
        <title>BlueMap</title>

        <!-- Baut die Root-Pfade von BlueMap sauber auf relative Pfade um (lädt textures.json direkt vom Server) -->
        <script>
          const origFetch = window.fetch;
          window.fetch = function(resource, init) {
            let url = resource instanceof Request ? resource.url : resource;
            if (typeof url === 'string') {
              if (url === '/settings.json' || url === 'settings.json') {
                url = './settings.json';
              } else if (url.startsWith('/maps/')) {
                url = '.' + url;
              } else if (url.startsWith('/assets/')) {
                url = '.' + url;
              } else if (url.startsWith('/lang/')) {
                url = '.' + url;
              }
            }
            if (resource instanceof Request) {
              resource = new Request(url, init);
            } else {
              resource = url;
            }
            return origFetch.call(this, resource, init);
          };
        </script>

        <script type="module" crossorigin src="./assets/index-Pvo3QD2A.js"></script>
        <link rel="stylesheet" crossorigin href="./assets/index-BgiqB2rB.css">
    </head>
    <body>
        <div id="map-container"></div>
        <div id="app"></div>
    </body>
</html>
