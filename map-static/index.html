<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
        <meta name="description" content="BlueMap Offline Backup">
        <meta name="version" content="5.16">
        <title>BlueMap - Offline</title>
        
        <link rel="icon" href="./assets/favicon-DEN7TZ5X.png">
        <link rel="manifest" href="./assets/manifest-vz4Wm4Dd.webmanifest">

        <!-- 100% Browser-Side Path Fix: Zwingt BlueMap dazu, alle Daten lokal im Ordner zu suchen -->
        <script>
          (function() {
            const fixPath = (url) => {
              if (typeof url === 'string') {
                // Wenn BlueMap nach Root-Pfaden fragt, auf den lokalen Ordner umleiten
                if (url === '/settings.json' || url === 'settings.json') return './settings.json';
                if (url === '/textures.json' || url === 'textures.json') return './textures.json';
                if (url.startsWith('/maps/')) return '.' + url;
                if (url.startsWith('/assets/')) return '.' + url;
                if (url.startsWith('/lang/')) return '.' + url;
              }
              return url;
            };

            // Fetch überschreiben
            const origFetch = window.fetch;
            window.fetch = function(resource, init) {
              if (resource instanceof Request) {
                const newUrl = fixPath(resource.url);
                if (newUrl !== resource.url) {
                  resource = new Request(newUrl, init);
                }
              } else {
                resource = fixPath(resource);
              }
              return origFetch.call(this, resource, init);
            };

            // XMLHttpRequest (XHR) überschreiben
            const origOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
              arguments[1] = fixPath(url);
              return origOpen.apply(this, arguments);
            };
          })();
        </script>

        <script type="module" crossorigin src="./assets/index-Pvo3QD2A.js"></script>
        <link rel="stylesheet" crossorigin href="./assets/index-BgiqB2rB.css">
    </head>
    <body>
        <div id="map-container"></div>
        <div id="app"></div>
    </body>
</html>
